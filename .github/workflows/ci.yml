name: CI

on:
  workflow_call:
  push:
    branches: [main, "sdk/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # E2E tests need a live engine; they self-skip unless OC_E2E_TEST=1.
      OC_E2E_TEST: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, non-e2e)
        run: pytest tests/ -q
