name: CI

on:
  workflow_call:
  push:
    branches: [main, "sdk/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # E2E tests need a live engine; they self-skip unless OC_E2E_TEST=1.
      OC_E2E_TEST: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]" build

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest, non-e2e)
        run: pytest tests/ -q

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify fresh wheel install and typing marker
        run: python scripts/verify_package.py
